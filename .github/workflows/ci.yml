name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: liveid
          POSTGRES_PASSWORD: liveid
          POSTGRES_DB: liveid_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U liveid" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://liveid:liveid@127.0.0.1:5432/liveid_test
      E2E_DATABASE_URL: postgres://liveid:liveid@127.0.0.1:5432/liveid_e2e
      POCKETSPHINX_PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: System tools (ffmpeg with the flite voice, fonts for the specimen card)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Offline speech recognizer
        run: python -m pip install pocketsphinx==5.1.1
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Tests (logic, full flow on PostgreSQL, real face/voice/OCR models)
        run: npm test
      - name: Browser end-to-end (Chromium with a fake camera)
        run: |
          PGPASSWORD=liveid psql -h 127.0.0.1 -U liveid -d liveid_test -c "create database liveid_e2e"
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: artifacts/e2e
          if-no-files-found: ignore

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: liveid
          POSTGRES_PASSWORD: liveid
          POSTGRES_DB: liveid
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U liveid" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Build the production image
        run: docker build -t liveid-takatak:ci .
      - name: Start it in production mode (throwaway keys, providers never called)
        run: |
          SECRET=$(openssl rand -hex 32)
          ENC=$(openssl rand -base64 32)
          SIGN=$(node -e "const k=require('crypto').generateKeyPairSync('ed25519').privateKey.export({format:'jwk'});console.log(JSON.stringify({...k,alg:'EdDSA',use:'sig'}))")
          docker run -d --name liveid --network host \
            -e NODE_ENV=production -e PUBLIC_URL=https://liveid.example -e TRUST_PROXY=true \
            -e DATABASE_URL=postgres://liveid:liveid@127.0.0.1:5432/liveid \
            -e LIVEID_SECRET="$SECRET" -e LIVEID_ENCRYPTION_KEY="$ENC" -e LIVEID_SIGNING_KEY="$SIGN" \
            -e SMS_PROVIDER=twilio -e TWILIO_ACCOUNT_SID=ACci -e TWILIO_AUTH_TOKEN=ci -e TWILIO_FROM=+15140000000 \
            -e EMAIL_PROVIDER=smtp -e SMTP_URL=smtp://ci:ci@127.0.0.1:2525 \
            liveid-takatak:ci
          for i in $(seq 1 90); do curl -fs http://127.0.0.1:8080/healthz && break; sleep 2; done
          curl -fs http://127.0.0.1:8080/healthz
          curl -fs http://127.0.0.1:8080/.well-known/openid-configuration > /dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/dev/outbox)" = "404"
          docker exec liveid /opt/speech/bin/python -c "import pocketsphinx; print('speech ok')"
      - if: failure()
        run: docker logs liveid || true
